<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>油脂精炼工艺模拟引擎 — 姜振宇</title>
<style>
:root{--bg:#f3efe5;--card:#fff;--text:#2c2218;--muted:#7a6e5e;--border:#ddd4c0;--accent:#8b5e3c;--accent2:#4a3020;--gold:#c8963e;--green:#27ae60;--red:#c0392b;--blue:#2980b9;--purple:#8e44ad;--radius:10px;--shadow:0 1px 8px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.topbar{background:linear-gradient(135deg,#1a1008,#3a2414);color:#e0d0b0;padding:0 24px;height:54px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;letter-spacing:1px;user-select:none}
.topbar .brand{color:var(--gold);font-size:20px}
.topbar .contact{font-size:11px;opacity:.7;margin-left:4px}
.topbar .contact span{margin:0 6px}
.topbar .toggle-btn{display:inline-block;background:none;border:none;color:#e0d0b0;font-size:20px;cursor:pointer;padding:4px 8px;margin-right:4px;line-height:1}
.layout{display:flex;min-height:calc(100vh-54px)}
.sidebar{width:180px;min-width:180px;background:var(--card);border-right:1px solid var(--border);padding:10px 0;flex-shrink:0;font-size:11px;overflow-x:hidden;transition:margin-left .3s}
.sidebar.collapsed{margin-left:-180px;min-width:0;width:0;padding:0;border:none}
.sidebar h4{font-size:10px;color:var(--muted);padding:0 10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.sidebar .item{padding:6px 10px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;transition:.12s;white-space:nowrap}
.sidebar .item:hover{background:#faf6ec}
.sidebar .item .badge{font-size:9px;padding:1px 5px;border-radius:6px;background:var(--border)}
.sidebar button{margin:8px 10px;padding:4px;width:calc(100%-20px);border:2px dashed var(--border);border-radius:4px;background:none;cursor:pointer;color:var(--muted);font-size:10px}
.layout{display:flex;min-height:calc(100vh-54px)}
.sidebar{width:160px;min-width:100px;background:var(--card);border-right:1px solid var(--border);padding:10px 0;flex-shrink:0;font-size:11px;overflow:hidden}
.sidebar h4{font-size:10px;color:var(--muted);padding:0 14px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.sidebar .item{padding:7px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;transition:.12s}
.sidebar .item:hover{background:#faf6ec}.sidebar .item .badge{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--border)}
.sidebar button{margin:10px 14px;padding:5px;width:calc(100%-28px);border:2px dashed var(--border);border-radius:5px;background:none;cursor:pointer;color:var(--muted);font-size:11px}
.main{flex:1;padding:20px;overflow-y:auto;display:flex;gap:16px}
.form-panel{width:320px;flex-shrink:0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;position:sticky;top:20px;align-self:flex-start}
.form-panel h3{font-size:14px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);color:var(--accent2);letter-spacing:1px}
.fg{margin-bottom:9px}.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:2px}
.fg input,.fg select{width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:12px;background:#faf8f2;color:var(--text)}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,94,60,.08)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:10px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:.15s}
.btn-p{background:var(--accent2);color:#f0e0c0}.btn-p:hover{background:#5a3a2a}
.btn-o{background:none;border:1.5px solid var(--accent);color:var(--accent);margin-top:5px}
.btn-o:hover{background:rgba(139,94,60,.05)}
.btn-s{background:none;border:1px solid var(--border);color:var(--muted);margin-top:3px;font-size:11px}
.note{font-size:10px;color:#c8963e;padding:5px 7px;margin:4px 0;background:#fef9ee;border-radius:4px;line-height:1.4;display:none;border-left:2px solid var(--gold)}
.result-area{flex:1;display:flex;flex-direction:column;gap:10px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center}
.kpi .num{font-size:24px;font-weight:700;color:var(--accent2)}.kpi .tag{font-size:10px;color:var(--muted);margin-top:2px}
.stage{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.stage .head{padding:11px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;border-bottom:1px solid transparent;transition:.12s}
.stage .head:hover{background:#faf6ec}
.stage .body{padding:14px;display:none}.stage .body.show{display:block}
.stage table{width:100%;font-size:11px;border-collapse:collapse}
.stage td{padding:4px 8px;border-bottom:1px solid #f5efe0}
.stage td:first-child{color:var(--muted);width:42%}
.stage td:last-child{font-weight:600}
.sankey{display:flex;height:38px;border-radius:7px;overflow:hidden;font-size:10px;font-weight:700;text-align:center;color:#fff;margin:8px 0}
.sankey div{display:flex;align-items:center;justify-content:center;overflow:hidden}
.empty{text-align:center;padding:80px 20px;color:#c4b8a0}
.finding{padding:10px 12px;background:#faf8f2;border-radius:6px;margin:8px 0;font-size:12px;line-height:1.5}
.saving-row{display:flex;justify-content:space-between;padding:3px 8px;font-size:10px;border-bottom:1px solid #f5f0e4}
.footer-bar{text-align:center;padding:10px;font-size:10px;color:#b8a890;border-top:1px solid var(--border);margin-top:auto}
.compare-table{width:100%;font-size:12px;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
.compare-table th{background:#f5efe0;padding:7px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.compare-table td{padding:6px 10px;border-bottom:1px solid #f5f0e4}
.best{color:var(--green);font-weight:700}.worst{color:var(--red)}
@media(max-width:900px){.layout{flex-direction:column}.sidebar{width:100%!important;min-width:100%!important;max-height:120px;overflow-y:auto}.sidebar.collapsed{max-height:0;min-width:0!important;width:0!important;margin-left:0}.main{flex-direction:column!important}.form-panel{width:100%!important;position:static!important}.topbar .toggle-btn{font-size:18px}.topbar .contact{display:none}.kpi-row{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:500px){.form-panel{padding:12px}.kpi-row{grid-template-columns:1fr!important}.stage .head{font-size:11px}}
</style></head><body>

<div class="topbar">
  <button class="toggle-btn" onclick="toggleSidebar()" title="折叠侧边栏">&#9776;</button>

    <button onclick="setLang('en')" style="background:none;border:1px solid #666;color:#e0d0b0;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px" title="English">EN</button>
    <button onclick="setLang('ru')" style="background:none;border:1px solid #666;color:#e0d0b0;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px" title="Русский">RU</button>
  </span>
  <span class="contact">姜振宇 <span>|</span> 15961418818</span>
</div>

<div class="layout">
<div class="sidebar">
  <h4>已保存方案</h4>
  <div id="scenarioList"><div style="padding:14px;font-size:11px;color:#ccc;text-align:center">暂无<br>运行后可保存</div></div>
  <button onclick="savedScenarios=[];renderSidebar()">清空全部</button>
</div>

<div class="main">
<div class="form-panel">
  <h3>&#9881; 工艺参数设置</h3>
  <div class="fg"><label>油种选择</label><select id="oilType" onchange="onOilChange()" title="选择原料油种类，系统将自动填入该油种的典型指标和推荐工艺参数">
    <option value="大豆油">大豆油</option><option value="菜籽油">菜籽油</option><option value="花生油">花生油</option><option value="葵花籽油">葵花籽油</option><option value="玉米油">玉米油</option><option value="棉籽油">棉籽油</option><option value="棕榈油">棕榈油</option><option value="米糠油">米糠油</option>
  </select></div>
  <div class="fr"><div class="fg"><label>批量 (吨)</label><input id="mass" value="100" type="number" min="1"></div>
  <div class="fg"><label>酸价 AV (mgKOH/g)</label><input id="av" value="2.0" type="number" step="0.1" min="0.1" max="30"></div></div>
  <div class="fr"><div class="fg"><label>总磷 (ppm)</label><input id="p" value="800" type="number" min="5" max="2000"></div>
  <div class="fg"><label>非水化磷脂占比</label><input id="nhp" value="0.15" type="number" step="0.01" min="0.01" max="0.40"></div></div>
  <div class="fr"><div class="fg"><label>脱胶方式</label><select id="degum">
    <option value="acid">酸法脱胶</option><option value="water">水化脱胶</option><option value="super">超级脱胶</option><option value="enzymatic">酶法脱胶</option>
  </select></div>
  <div class="fg"><label>精炼路线</label><select id="route"><option value="chemical">化学精炼 (碱炼)</option><option value="physical">物理精炼 (跳过碱炼)</option></select></div></div>
  <div class="fr"><div class="fg"><label>磷酸添加量 (%)</label><input id="pa_pct" value="0.10" type="number" step="0.01" min="0.03" max="0.30"></div>
  <div class="fg"><label>超量碱 (%)</label><input id="excess" value="0.12" type="number" step="0.01" min="0.03" max="0.35"></div></div>
  <div class="fg"><label>脱蜡 (葵花/玉米/米糠油)</label><select id="wax"><option value="0">否</option><option value="1">是</option></select></div>
  <div class="note" id="note"></div>
  <div id="loadingOverlay" style="display:none;background:rgba(255,255,255,.95);border-radius:var(--radius);padding:20px;margin:8px 0;text-align:center;border:1px solid var(--border)">
    <div style="font-weight:700;font-size:13px;color:var(--accent2);margin-bottom:6px">⏳ 正在运行模拟...</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px" id="loadingStage">连接服务器...</div>
    <div style="background:#e8e0d0;border-radius:10px;height:8px;overflow:hidden">
      <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .3s"></div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px" id="loadingPct">0%</div>
  </div>
  <button class="btn btn-p" onclick="run()">&#9654; 运行全流程模拟</button>
  <button class="btn btn-o" onclick="autoOptimize()">&#9889; 一键智能优化</button>
  <button class="btn btn-s" onclick="saveScenario()">&#128190; 保存当前方案</button>
  <button class="btn btn-o" onclick="runPareto()" style="border-color:#8e44ad;color:#8e44ad">&#128202; 帕累托多目标优化</button>
  <button class="btn btn-s" onclick="exportCSV()">&#128229; 导出 Excel (CSV)</button>
  <button class="btn btn-s" onclick="resetParams()">&#8634; 恢复默认</button>

  <div style="margin-top:12px;padding:10px;background:#fef9f0;border-radius:6px;border:1px solid #f0e0c0;display:none" id="calibPanel">
    <div style="font-size:11px;font-weight:700;color:#e67e22;margin-bottom:6px">🔧 模型校准 (输入工厂实测数据)</div>
    <div class="fr"><div class="fg"><label>实际得率(%)</label><input id="calYield" type="number" step="0.1" placeholder="如 93.5"></div>
    <div class="fg"><label>实际AV</label><input id="calAV" type="number" step="0.01" placeholder="如 0.05"></div></div>
    <div class="fr"><div class="fg"><label>实际蒸汽(kg/t)</label><input id="calSteam" type="number" step="1" placeholder="如 80"></div>
    <div class="fg"><label>实际白土(%)</label><input id="calEarth" type="number" step="0.1" placeholder="如 1.2"></div></div>
    <button class="btn btn-s" onclick="runCalibration()" style="color:#e67e22;border-color:#e67e22">📐 计算偏差</button>
    <div id="calibResult" style="font-size:10px;margin-top:4px"></div>
  </div>
  <button class="btn btn-s" onclick="toggleCalibration()" style="margin-top:4px">🔧 校准模式</button>
</div>

<div class="result-area" id="results">
  <div class="empty"><div style="font-size:48px;margin-bottom:8px">&#128300;</div><p style="font-size:14px">设置工艺参数后点击「运行全流程模拟」</p><p style="font-size:11px;color:#d4c8b0;margin-top:4px">将模拟完整四段精炼：脱胶 → 碱炼 → 脱色 → 脱臭</p></div>
</div>
</div></div>

<div class="footer-bar">⚠ 模型基于公开文献经验系数，未经工厂实测数据校准。实际应用请以 calibration.py 对标本厂历史数据 &nbsp;|&nbsp; 技术支持：姜振宇 15961418818 &nbsp;|&nbsp; v3.1</div>

<script src="app.js"></script>
<!--
const OIL_TYPICALS={大豆油:{av:2.0,p:800,nhp:.15},菜籽油:{av:2.0,p:300,nhp:.10},花生油:{av:1.0,p:100,nhp:.08},葵花籽油:{av:2.0,p:200,nhp:.10},玉米油:{av:3.0,p:250,nhp:.10},棉籽油:{av:8.0,p:600,nhp:.12},棕榈油:{av:5.0,p:15,nhp:.05},米糠油:{av:15.0,p:1200,nhp:.10}};
let currentResult=null,allResults=[],savedScenarios=[],pendingRadar=null;

async function onOilChange(){
  const v=document.getElementById('oilType').value,t=OIL_TYPICALS[v];
  if(t){document.getElementById('av').value=t.av;document.getElementById('p').value=t.p;document.getElementById('nhp').value=t.nhp}
  try{
    const r=await fetch('/api/smart-defaults?oil='+encodeURIComponent(v)),s=await r.json();
    document.getElementById('degum').value=s.degum||'acid';document.getElementById('pa_pct').value=s.pa_pct||.1;
    document.getElementById('excess').value=s.excess_lye||.12;document.getElementById('route').value=s.route||'chemical';
    document.getElementById('wax').value=s.wax?'1':'0';
    document.getElementById('note').textContent='💡 '+s.note||'';document.getElementById('note').style.display='block';
  }catch(e){}
}
function getParams(){return{oil:document.getElementById('oilType').value,mass:parseFloat(document.getElementById('mass').value),av:parseFloat(document.getElementById('av').value),p:parseFloat(document.getElementById('p').value),nhp:parseFloat(document.getElementById('nhp').value),degum:document.getElementById('degum').value,pa_pct:parseFloat(document.getElementById('pa_pct').value),excess:parseFloat(document.getElementById('excess').value),route:document.getElementById('route').value,wax:document.getElementById('wax').value==='1'}}

async function run(){
  const btn=document.querySelector('.btn-p');btn.textContent='⏳ 计算中...';btn.disabled=true;
  const body=getParams();
  try{
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();currentResult=d;allResults=[d];renderResult(d);fetchAdvanced();
  }catch(e){document.getElementById('results').innerHTML='<div class=empty style=color:#c0392b><p style=font-size:18px>⚠ 运行失败</p><p>'+e.message+'</p><p style=font-size:11px;margin-top:8px>请确认服务器正常运行 (127.0.0.1:5090)</p></div>'}
  btn.textContent='▶ 运行全流程模拟';btn.disabled=false;
}

function renderResult(d){
  const o=d.output,adv=d.advisor||{},cost=d.cost||{},stages=d.stages||[],mass=d.input.mass_ton;
  let h='';

  // KPI cards
  const cYield=o.yield_pct>=92?'#27ae60':o.yield_pct>=85?'#2980b9':'#c0392b';
  const cAV=o.product_av<=.08?'#27ae60':o.product_av<=.2?'#e67e22':'#c0392b';
  h+='<div class=kpi-row><div class=kpi><div class=num style=color:'+cYield+'>'+o.yield_pct+'%</div><div class=tag>精炼得率</div></div>';
  h+='<div class=kpi><div class=num>'+(o.total_loss_kg/1000).toFixed(1)+' T</div><div class=tag>总油损 ('+o.total_loss_pct+'%)</div></div>';
  h+='<div class=kpi><div class=num style=color:'+cAV+'>'+o.product_av+'</div><div class=tag>成品酸价 AV</div></div>';
  h+='<div class=kpi><div class=num>R '+o.product_color_r+' / Y '+o.product_color_y+'</div><div class=tag>成品色泽 (罗维朋 1")</div></div></div>';

  // Sankey flow
  let losses=[],colors=['#e67e22','#c0392b','#8e44ad','#2980b9'];
  for(const s of stages){let lp=0,lk=0;for(const[k,v]of Object.entries(s.results)){const vs=String(v);if(k.includes('总油损%')||k.includes('总油损_%'))lp=parseFloat(vs.replace('%',''))||0;if(k.includes('总油损_kg'))lk=parseFloat(v)||0}losses.push({name:s.name,pct:lp,kg:lk/1000})}
  const tLoss=losses.reduce((s,l)=>s+l.kg,0),prod=mass-tLoss;
  h+='<div class=stage><div class=head onclick="this.nextElementSibling.classList.toggle(\'show\')">📊 物料流向图 · '+mass.toFixed(0)+'T 毛油 → '+prod.toFixed(1)+'T 成品 ▼</div><div class="body show"><div class=sankey>';
  for(let i=0;i<losses.length;i++){const w=losses[i].kg/mass*100;h+='<div style=width:'+w+'%;background:'+colors[i]+' title='+losses[i].name+'>'+losses[i].kg.toFixed(1)+'</div>'}
  h+='<div style=flex:1;background:#27ae60;min-width:55px>成品 '+prod.toFixed(1)+'T</div></div><div style=display:flex;gap:14px;flex-wrap:wrap;font-size:10px;margin-top:6px>';
  for(let i=0;i<losses.length;i++)h+='<span><span style=display:inline-block;width:10px;height:10px;border-radius:2px;background:'+colors[i]+';margin-right:3px></span>'+losses[i].name+': '+losses[i].kg.toFixed(1)+'T ('+losses[i].pct.toFixed(1)+'%)</span>';
  h+='</div><p style="font-size:10px;color:var(--muted);margin-top:4px">油损占比合计: '+(tLoss/mass*100).toFixed(1)+'% | 精炼得率: '+(prod/mass*100).toFixed(1)+'%</p></div></div>';

  // Advisor
  if(adv.findings&&adv.findings.length>0){
    h+='<div class=stage style=border-left:4px solid #e67e22><div class=head style=background:#fef9f0 onclick="this.nextElementSibling.classList.toggle(\'show\')">🔍 工艺优化建议 · '+adv.findings.length+'项 · '+adv.saving_desc+' ▼</div><div class="body show">';
    for(const f of adv.findings){
      const color=f.severity===3?'#c0392b':'#e67e22',sev=f.severity===3?'🔴 严重':'🟡 需关注';
      h+='<div class=finding style=border-left:3px solid '+color+'><div style=font-weight:700;color:'+color+'>'+sev+' | '+f.stage+' — '+f.title+'</div><div style=color:#888;font-size:10px;margin:3px 0>📋 根因分析: '+f.cause+'</div><div style=color:#27ae60;font-weight:600>✅ 改进措施: '+f.suggestion+'</div>';
      if(f.savings_breakdown&&f.savings_breakdown.length>0){
        h+='<div style=margin-top:6px;background:#fff;border-radius:4px;overflow:hidden;border:1px solid #e8e0d0><div style=font-size:10px;font-weight:700;padding:5px 8px;background:#f5efe0>💰 节费拆解 · 合计: '+f.total_saving_desc+'</div>';
        for(const s of f.savings_breakdown){const amt=s.amount>=1e4?'¥'+(s.amount/1e4).toFixed(1)+'万':'¥'+s.amount.toFixed(0);h+='<div class=saving-row><span><span style=background:#e8e0d0;padding:1px 5px;border-radius:3px;font-size:9px;margin-right:4px>'+s.category+'</span>'+s.label+'</span><span style=color:#c0392b;font-weight:700>'+amt+'</span></div><div style=font-size:9px;color:#888;padding:1px 8px>'+s.detail+'</div>'}
        if(f.investment>0)h+='<div style=font-size:10px;padding:4px 8px;background:#fef9f0;font-weight:600>🔧 预计投资: ¥'+(f.investment/1e4).toFixed(1)+'万 | 回收期: '+f.payback_months+'个月</div>';
        h+='</div>';
      }h+='</div>';
    }
    if(adv.saving_categories&&Object.keys(adv.saving_categories).length>0){
      h+='<div style=margin-top:8px;padding:12px;background:linear-gradient(135deg,#eaf7ea,#f0fdf0);border-radius:8px;border:1px solid #b8dcb8><div style=font-weight:700;color:#27ae60;font-size:13px>💎 节能增效汇总: '+adv.saving_desc+'</div><div style=display:flex;gap:8px;flex-wrap:wrap;margin-top:6px>';
      for(const[cat,amt]of Object.entries(adv.saving_categories))h+='<div style=background:#fff;padding:7px 12px;border-radius:6px;text-align:center;font-size:11px><b style=color:#27ae60>¥'+(amt>=1e4?(amt/1e4).toFixed(1)+'万':amt.toFixed(0))+'</b><br><span style=font-size:9px;color:#7a6e5e>'+cat+'</span></div>';
      h+='</div></div>';
    }h+='</div></div>';
  }

  // Cost
  var costDetail=cost['加工成本'];
  if(costDetail){
    var costPerTon=cost['吨油加工成本_元每吨'],marginPerTon=cost['吨油毛利_元每吨'];
    var totalCost=cost['总加工成本_元'],byproduct=cost['副产品总收入_元'],grossMargin=cost['加工毛利_元'];
    h+='<div class=stage><div class=head onclick="this.nextElementSibling.classList.toggle(\'show\')">💰 成本核算 · 吨油加工费 ¥'+costPerTon+' | 吨油毛利 ¥'+marginPerTon+' ▼</div><div class=body><table>';
    for(var k in costDetail)h+='<tr><td>'+k+'</td><td style=color:#c0392b>¥ '+costDetail[k].toLocaleString()+'</td></tr>';
    h+='<tr style=font-weight:700;background:#f0f6fb><td>总加工成本</td><td>¥ '+totalCost.toLocaleString()+'</td></tr>';
    h+='<tr style=font-weight:700;background:#eaf7ea><td>副产品收入</td><td style=color:#27ae60>+¥ '+byproduct.toLocaleString()+'</td></tr>';
    h+='<tr style=font-weight:700;background:#eaf7ea;font-size:13px"><td>加工毛利</td><td style=color:#27ae60>¥ '+grossMargin.toLocaleString()+'</td></tr>';
    h+='</table></div></div>';
  }

  // Stage details
  for(const s of stages){
    h+='<div class=stage><div class=head onclick="this.nextElementSibling.classList.toggle(\'show\')">📋 '+s.name+' 详细参数 ▼</div><div class=body><table>';
    for(const[k,v]of Object.entries(s.results))h+='<tr><td>'+k+'</td><td>'+v+'</td></tr>';
    h+='</table></div></div>';
  }
  document.getElementById('results').innerHTML=h;
}

async function fetchAdvanced(){
  if(!currentResult)return;
  const body=getParams();body.mass_ton=body.mass;body.stages=currentResult.stages;
  const fetchJSON=async(url)=>{try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return null;return await r.json()}catch(e){return null}};
  const[radar,carbon,cp]=await Promise.all([fetchJSON('/api/advanced/radar'),fetchJSON('/api/advanced/carbon'),fetchJSON('/api/advanced/chokepoint')]);
  let block='<div style=display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px>';

  // Radar with axis labels and better styling
  if(radar&&radar.scores){
    block+='<div class=stage style=border-left:4px solid #8e44ad><div class=head style=background:#faf5ff>📡 五维综合评分 · '+radar.grade+' · '+radar.total_score+'/100 <span style=font-size:10px>经济性/品质/营养保留/食品安全/环保</span></div><div class="body show" style=padding:12px><div style=display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center><canvas id=radarCanvas width=260 height=260></canvas><div style=font-size:11px>';
    for(const[k,v]of Object.entries(radar.scores)){const c=v>=80?'#27ae60':v>=60?'#2980b9':v>=40?'#e67e22':'#c0392b';block+='<div style=padding:3px 0><span style=display:inline-block;width:8px;height:8px;border-radius:50%;background:'+c+';margin-right:6px></span><b>'+v.toFixed(0)+'</b>/100 — '+k+'</div>'}
    block+='</div></div></div></div>';
    pendingRadar=radar.scores;
  }else{block+='<div></div>'}

  // Carbon
  if(carbon){
    var cfRating=carbon['碳足迹评级']||'?',cfPerTon=parseFloat(carbon['吨油碳足迹_kgCO2每吨']||0).toFixed(0);
    var cfCBAM=carbon['EU_CBAM估算成本_元每批']||0,cfTotal=carbon['合计_kgCO2每批']||0,cfTip=carbon['减排建议']||'';
    var cfDetail=carbon['排放明细']||{};
    block+='<div class=stage style=border-left:4px solid #27ae60><div class=head style=background:#f0fdf0>🌍 碳足迹 · '+cfRating+' · '+cfPerTon+' kg CO₂/t <span style=font-size:10px>EU CBAM预计 ¥'+cfCBAM+'/批</span></div><div class="body show" style=padding:12px;font-size:11px>';
    for(var ck in cfDetail)block+='<div style=display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #f0f8f0><span>'+ck+'</span><span style=font-weight:600>'+cfDetail[ck]+' kgCO₂</span></div>';
    block+='<div style=font-weight:700;padding:4px 0;border-top:2px solid #b8dcb8;margin-top:4px>合计: '+cfTotal+' kgCO₂/批 ('+cfPerTon+' kg/t)</div>';
    if(cfTip)block+='<div style=margin-top:6px;padding:6px;background:#fef9f0;border-radius:4px;font-size:10px'>💡 '+cfTip+'</div></div></div>';
  }else{block+='<div></div>'}
  block+='</div>';

  // Supply chain
  if(cp&&cp.items&&cp.items.length>0){
    block+='<div class=stage style=border-left:4px solid #2980b9;margin-top:12px><div class=head style=background:#f0f6fb>📦 供应链优化 · 进口与国产方案经济对比 · '+cp.summary+'</div><div class="body show" style=padding:12px;overflow-x:auto>';
    block+='<table style=font-size:11px;width:100%;min-width:700px><thead><tr style=background:#f0f6fb;font-weight:700><td>优化项目</td><td>当前进口占比</td><td>进口方案年成本</td><td>国产方案年成本</td><td>年可节省</td><td>优化建议</td></tr></thead><tbody>';
    for(const item of cp.items||[]){
      const sc=item.annual_saving>0?'#27ae60':'#c0392b';
      const ic=item.annual_cost_import||item.import_price_per_year||0,dc=item.annual_cost_domestic||item.domestic_price_per_year||0;
      block+='<tr><td><b>'+(item.foreign_supplier||'').split('(')[0].trim()+'</b><br><span style=font-size:9px;color:#888>⇢ '+(item.domestic_alternative||'').split('(')[0].trim()+'</span></td><td style=color:#888>'+item.current_status+'</td><td>¥ '+ic.toLocaleString()+'</td><td>¥ '+dc.toLocaleString()+'</td><td style=color:'+sc+';font-weight:700>¥ '+Math.abs(item.annual_saving||0).toLocaleString()+'</td><td style=font-size:10px>'+item.recommendation+'</td></tr>';
    }
    block+='<tr style=font-weight:700;background:#f0f6fb;font-size:12px"><td colspan=4>全部采纳后年度总计</td><td style=color:#27ae60>年可省 ¥ '+(cp.total_annual_saving||0).toLocaleString()+'</td><td></td></tr></tbody></table></div></div>';
  }

  document.getElementById('results').insertAdjacentHTML('beforeend',block);
  setTimeout(drawRadarIfReady,300);
}

function drawRadarIfReady(){
  if(!pendingRadar)return;const c=document.getElementById('radarCanvas');if(!c)return;
  const ctx=c.getContext('2d'),cx=130,cy=130,r=105,keys=Object.keys(pendingRadar),n=keys.length,labels=['经济性','品质','营养保留','食品安全','环保'];
  ctx.clearRect(0,0,260,260);
  // Grid
  for(let i=5;i>=1;i--){ctx.beginPath();for(let j=0;j<n;j++){const a=-Math.PI/2+j*2*Math.PI/n,rr=r*i/5;ctx[j===0?'moveTo':'lineTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a))}ctx.closePath();ctx.strokeStyle=i===5?'rgba(0,0,0,.12)':'rgba(0,0,0,.04)';ctx.stroke();ctx.fillStyle='rgba(250,245,240,'+(i*.04)+')';ctx.fill()}
  // Axes + labels
  ctx.fillStyle='#7a6e5e';ctx.font='10px Microsoft YaHei';ctx.textAlign='center';
  for(let j=0;j<n;j++){const a=-Math.PI/2+j*2*Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='rgba(0,0,0,.08)';ctx.stroke();const lx=cx+(r+16)*Math.cos(a),ly=cy+(r+16)*Math.sin(a);ctx.fillText(labels[j],lx,ly)}
  // Data polygon
  ctx.beginPath();for(let j=0;j<n;j++){const a=-Math.PI/2+j*2*Math.PI/n,rr=r*Math.max(.05,pendingRadar[keys[j]]/100);ctx[j===0?'moveTo':'lineTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a))}ctx.closePath();
  ctx.fillStyle='rgba(142,68,173,.12)';ctx.fill();ctx.strokeStyle='#8e44ad';ctx.lineWidth=2.5;ctx.stroke();
  // Dots + scores
  for(let j=0;j<n;j++){const a=-Math.PI/2+j*2*Math.PI/n,rr=r*Math.max(.05,pendingRadar[keys[j]]/100);ctx.beginPath();ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),4,0,2*Math.PI);ctx.fillStyle='#8e44ad';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 8px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(pendingRadar[keys[j]].toFixed(0),cx+rr*Math.cos(a),cy+rr*Math.sin(a)-8)}
  pendingRadar=null;
}

async function autoOptimize(){
  const body=getParams();
  try{const r=await fetch('/api/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
  if(d.degum_suggestion)document.getElementById('degum').value=d.degum_suggestion;document.getElementById('pa_pct').value=d.optimized.pa_pct;document.getElementById('excess').value=d.optimized.excess_lye;document.getElementById('route').value=d.optimized.route;document.getElementById('wax').value=d.optimized.wax?'1':'0';
  if(d.changes&&d.changes.length>0){let m='已优化 '+d.changes.length+' 项参数:\n';for(const c of d.changes)m+='• '+c.param+': '+c.current+' → '+c.optimized+'\n  影响: '+c.impact+'\n';alert(m)}run()}catch(e){alert('优化失败: '+e.message)}
}
function saveScenario(){if(!currentResult){alert('请先运行模拟');return}const p=getParams();savedScenarios.push({name:p.oil+' | AV:'+p.av+' P:'+p.p,params:p,result:currentResult});renderSidebar()}
function loadScenario(i){const s=savedScenarios[i];['oilType','mass','av','p','nhp','degum','pa_pct','excess'].forEach(k=>{const el=document.getElementById(k);if(el)el.value=s.params[k]||el.value});currentResult=s.result;renderResult(s.result)}
function renderSidebar(){if(!savedScenarios.length){document.getElementById('scenarioList').innerHTML='<div style=padding:14px;font-size:11px;color:#ccc;text-align:center>暂无</div>';return}let h='';savedScenarios.forEach((s,i)=>{h+='<div class=item onclick=loadScenario('+i+') style=cursor:pointer><span>'+(s.name||'').substring(0,20)+'</span><span class=badge>'+s.result.output.yield_pct+'%</span></div>'});document.getElementById('scenarioList').innerHTML=h}
