<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油脂精炼工艺模拟引擎 — 多方案对比</title>
<style>
:root {
  --bg: #f8f5ee; --card: #fff; --text: #3a3226; --muted: #8b7a66;
  --border: #e0d6c0; --accent: #8b5e3c; --accent2: #5a3e28;
  --danger: #c0392b; --good: #27ae60; --warn: #e67e22;
  --radius: 12px; --shadow: 0 2px 16px rgba(0,0,0,0.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* Top Nav */
.topbar { background: linear-gradient(135deg, #1a1410, #3a2a1a); color: #e8d8b8; padding: 0 28px; height: 56px; display:flex; align-items:center; gap:12px; }
.topbar .logo { font-size: 20px; font-weight:700; letter-spacing: 1px; }
.topbar .ver { font-size: 11px; opacity:0.5; }
.topbar nav { margin-left: auto; display:flex; gap:4px; }
.topbar nav a { color:#c0a880; text-decoration:none; padding:8px 16px; border-radius:6px; font-size:13px; transition:0.2s; }
.topbar nav a:hover, .topbar nav a.active { background:rgba(255,255,255,0.08); color:#f0d8a0; }

/* Layout */
.layout { display:flex; min-height:calc(100vh - 56px); }
.sidebar { width: 260px; background:var(--card); border-right:1px solid var(--border); padding:20px 0; flex-shrink:0; }
.sidebar h4 { font-size:12px; color:var(--muted); padding:0 20px; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.sidebar .scenario { padding:10px 20px; cursor:pointer; font-size:13px; border-left:3px solid transparent; transition:0.15s; display:flex; justify-content:space-between; align-items:center; }
.sidebar .scenario:hover { background:#faf6ec; }
.sidebar .scenario.active { border-left-color:var(--accent); background:#f5efe0; font-weight:600; }
.sidebar .scenario .badge { font-size:10px; padding:2px 8px; border-radius:10px; background:var(--border); }
.sidebar .btn-add { margin:12px 20px; padding:8px; width:calc(100% - 40px); border:2px dashed var(--border); border-radius:8px; background:none; cursor:pointer; font-size:13px; color:var(--muted); }
.sidebar .btn-add:hover { border-color:var(--accent); color:var(--accent); }
.main { flex:1; padding:28px; overflow-y:auto; display:flex; gap:20px; }

/* Form Panel */
.form-panel { width:340px; flex-shrink:0; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; position:sticky; top:28px; align-self:flex-start; }
.form-panel h3 { font-size:15px; margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid var(--accent); }
.form-g { margin-bottom:12px; }
.form-g label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:3px; }
.form-g input, .form-g select { width:100%; padding:7px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:13px; background:#faf8f2; }
.form-g input:focus, .form-g select:focus { outline:none; border-color:var(--accent); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn { width:100%; padding:11px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; letter-spacing:1px; transition:0.2s; }
.btn-primary { background:var(--accent2); color:#f0e0c0; }
.btn-primary:hover { background:#6b4e36; }
.btn-outline { background:none; border:2px solid var(--accent); color:var(--accent); margin-top:8px; }
.btn-report { background:#1a4a2e; color:#e0f0d0; margin-top:4px; }
.btn-report:hover { background:#235f3a; }

/* Results */
.result-area { flex:1; display:flex; flex-direction:column; gap:16px; }
.kpi-row { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
.kpi { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; text-align:center; }
.kpi .num { font-size:30px; font-weight:700; color:var(--accent2); }
.kpi .tag { font-size:11px; color:var(--muted); margin-top:2px; }
.stage { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.stage .head { padding:12px 18px; font-weight:600; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; background:#faf8f2; border-bottom:1px solid var(--border); }
.stage .head:hover { background:#f0e8d4; }
.stage .body { padding:16px; display:none; }
.stage .body.show { display:block; }
.stage table { width:100%; font-size:12px; border-collapse:collapse; }
.stage td { padding:4px 10px; border-bottom:1px solid #f5f0e4; }
.stage td:first-child { color:var(--muted); width:48%; }
.stage td:last-child { font-weight:600; }

/* Comparison Table */
.compare-table { width:100%; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; font-size:13px; }
.compare-table th { background:#f5efe0; padding:10px 14px; text-align:left; font-weight:600; border-bottom:2px solid var(--border); }
.compare-table td { padding:9px 14px; border-bottom:1px solid #f5f0e4; }
.compare-table tr:hover td { background:#faf8f2; }
.compare-table .best { color:var(--good); font-weight:700; }
.compare-table .worst { color:var(--danger); }

/* Report Modal */
.modal-overlay { position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:none; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:16px; max-width:900px; max-height:90vh; overflow-y:auto; padding:0; }
.modal-header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h2 { font-size:18px; }
.modal-body { padding:28px; }
.modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--muted); }
.report { font-family:'SimSun','KaiTi','STSong',serif; line-height:1.8; }
.report h2 { text-align:center; font-size:20px; margin-bottom:8px; }
.report .sub { text-align:center; font-size:12px; color:var(--muted); margin-bottom:24px; }
.report table { width:100%; border-collapse:collapse; margin:16px 0; }
.report th, .report td { border:1px solid #ccc; padding:6px 10px; font-size:12px; }
.report th { background:#f5f0e0; }
.seal { text-align:right; margin-top:24px; color:var(--danger); font-size:28px; font-weight:bold; font-family:'SimKai','KaiTi',serif; }

/* Empty state */
.empty { text-align:center; padding:80px; color:#ccc; }
.empty .icon { font-size:64px; }

/* Print styles */
@media print {
  .topbar, .sidebar, .form-panel, .modal-close, .btn { display:none !important; }
  .layout { display:block; }
  .main { display:block; padding:0; }
  .modal-overlay { position:static; display:block; background:none; }
  .modal { max-width:none; box-shadow:none; border-radius:0; }
}

.compare-toggle { display:flex; gap:8px; margin-bottom:12px; }
.compare-toggle button { padding:6px 14px; border:1.5px solid var(--border); border-radius:20px; background:none; cursor:pointer; font-size:12px; }
.compare-toggle button.active { background:var(--accent2); color:#f0e0c0; border-color:var(--accent2); }
</style>
</head>
<body>

<div class="topbar">
  <span style="font-size:22px;">&#9951;</span>
  <span class="logo">油脂精炼工艺模拟引擎</span>
  <span class="ver">v2.0 SaaS</span>
  <nav>
    <a href="#" class="active" onclick="switchView('sim',event)">单次模拟</a>
    <a href="#" onclick="switchView('compare',event)">多方案对比</a>
    <a href="#" onclick="openReport()" style="background:rgba(255,255,255,0.05);">&#128196; 导出报告</a>
  </nav>
</div>

<div class="layout">
  <!-- Sidebar: Saved Scenarios -->
  <div class="sidebar">
    <h4>已保存的方案</h4>
    <div id="scenarioList"><div class="empty" style="padding:20px;font-size:12px;text-align:center;">暂无保存的方案<br>运行模拟后可保存</div></div>
    <button class="btn-add" onclick="addScenario()">+ 新建方案</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Form -->
    <div class="form-panel">
      <div class="compare-toggle">
        <button class="active" onclick="setMode('single',event)">单方案</button>
        <button onclick="setMode('batch',event)">批量对比</button>
      </div>
      <h3>&#9881; 工艺参数</h3>
      <div class="form-g">
        <label>油种</label>
        <select id="oilType">
          <option value="大豆油">大豆油 (Soybean)</option>
          <option value="菜籽油">菜籽油 (Rapeseed)</option>
          <option value="花生油">花生油 (Peanut)</option>
          <option value="葵花籽油">葵花籽油 (Sunflower)</option>
          <option value="玉米油">玉米油 (Corn)</option>
          <option value="棉籽油">棉籽油 (Cottonseed)</option>
          <option value="棕榈油">棕榈油 (Palm)</option>
          <option value="米糠油">米糠油 (Rice Bran)</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-g"><label>批量 (T)</label><input id="mass" type="number" value="100" min="1"></div>
        <div class="form-g"><label>酸价 AV</label><input id="av" type="number" value="2.0" min="0.1" max="30" step="0.1"></div>
      </div>
      <div class="form-row">
        <div class="form-g"><label>磷 (ppm)</label><input id="p" type="number" value="800" min="5" max="2000"></div>
        <div class="form-g"><label>NHP 比例</label><input id="nhp" type="number" value="0.15" min="0.01" max="0.40" step="0.01"></div>
      </div>
      <div class="form-g">
        <label id="batchLabel">脱胶方式</label>
        <select id="degum">
          <option value="acid">酸法脱胶</option>
          <option value="water">水化脱胶</option>
          <option value="super">超级脱胶</option>
          <option value="enzymatic">酶法脱胶</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-g"><label>磷酸 (%)</label><input id="pa_pct" type="number" value="0.10" min="0.03" max="0.30" step="0.01"></div>
        <div class="form-g"><label>超量碱 (%)</label><input id="excess" type="number" value="0.12" min="0.03" max="0.35" step="0.01"></div>
      </div>
      <button class="btn btn-primary" onclick="runCurrent()">&#9654; 运行模拟</button>
      <button class="btn btn-outline" onclick="saveScenario()">&#128190; 保存方案</button>
    </div>

    <!-- Results -->
    <div class="result-area" id="results">
      <div class="empty"><div class="icon">&#128300;</div><p>设置参数后点击「运行模拟」</p></div>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <h2>精炼工艺模拟报告</h2>
      <div><button class="btn btn-report" onclick="window.print()" style="width:auto;padding:8px 20px;margin-right:8px;">&#128424; 打印</button><button class="modal-close" onclick="closeReport()">&times;</button></div>
    </div>
    <div class="modal-body"><div class="report" id="reportContent"></div></div>
  </div>
</div>

<script>
// State
let mode = 'single';
let savedScenarios = [];
let allResults = [];
let currentResult = null;

// Auto-fill typical values when oil type changes
const typicals = {
  '大豆油':{av:2.0,p:800,nhp:0.15}, '菜籽油':{av:2.0,p:300,nhp:0.10},
  '花生油':{av:1.0,p:100,nhp:0.08}, '葵花籽油':{av:2.0,p:200,nhp:0.10},
  '玉米油':{av:3.0,p:250,nhp:0.10}, '棉籽油':{av:8.0,p:600,nhp:0.12},
  '棕榈油':{av:5.0,p:15,nhp:0.05}, '米糠油':{av:15.0,p:1200,nhp:0.10}
};

document.getElementById('oilType').addEventListener('change',function(){
  const t = typicals[this.value];
  if(t){ document.getElementById('av').value=t.av; document.getElementById('p').value=t.p; document.getElementById('nhp').value=t.nhp; }
});

function switchView(v, evt){
  document.querySelectorAll('.topbar nav a').forEach(a=>a.classList.remove('active'));
  if(evt) evt.target.classList.add('active');
}

function setMode(m, evt){ mode = m;
  document.querySelectorAll('.compare-toggle button').forEach(b=>b.classList.remove('active'));
  if(evt) evt.target.classList.add('active');
}

function getParams(){
  return {
    oil: document.getElementById('oilType').value,
    mass: parseFloat(document.getElementById('mass').value),
    av: parseFloat(document.getElementById('av').value),
    p: parseFloat(document.getElementById('p').value),
    nhp: parseFloat(document.getElementById('nhp').value),
    degum: document.getElementById('degum').value,
    pa_pct: parseFloat(document.getElementById('pa_pct').value),
    excess: parseFloat(document.getElementById('excess').value),
  };
}

async function runCurrent(){
  const btn = document.querySelector('.btn-primary');
  btn.textContent = '计算中...'; btn.disabled = true;
  try {
  const body = getParams();
  console.log('Running with params:', body);
  if(mode === 'batch'){
    // Run 4 degum types at once
    allResults = [];
    const types = ['water','acid','super','enzymatic'];
    for(const dt of types){
      const b = {...body, degum: dt};
      const resp = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
      const data = await resp.json();
      data._label = dt;
      allResults.push(data);
    }
    currentResult = allResults[1]; // default show acid
    renderCompare(allResults);
    renderSingle(allResults[1]);
  } else {
    const resp = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok){ throw new Error('HTTP '+resp.status+': '+await resp.text()); }
    const data = await resp.json();
    console.log('API returned:', data);
    currentResult = data;
    allResults = [data];
    renderSingle(data);
  }
  } catch(e) {
    console.error(e);
    document.getElementById('results').innerHTML = '<div class="empty" style="color:#c0392b;"><p>运行失败: '+e.message+'</p><p style="font-size:12px;">请检查服务器是否正常运行 (127.0.0.1:5080)</p></div>';
  }
  const btn = document.querySelector('.btn-primary');
  btn.textContent = '▶ 运行模拟'; btn.disabled = false;
}

function renderSingle(data){
  const o = data.output;
  let html = '<div class="kpi-row">'+
    '<div class="kpi"><div class="num">'+o.yield_pct+'%</div><div class="tag">精炼得率</div></div>'+
    '<div class="kpi"><div class="num">'+(o.total_loss_kg/1000).toFixed(1)+' T</div><div class="tag">总油损</div></div>'+
    '<div class="kpi"><div class="num">'+o.product_av+'</div><div class="tag">成品酸价 AV</div></div>'+
    '<div class="kpi"><div class="num">R'+o.product_color_r+' / Y'+o.product_color_y+'</div><div class="tag">成品色泽 (罗维朋)</div></div>'+
    '</div>';

  for(const s of data.stages){
    html += '<div class="stage"><div class="head" onclick="this.nextElementSibling.classList.toggle(\'show\')">'+
      s.name+' <span>&#9660;</span></div><div class="body"><table>';
    for(const [k,v] of Object.entries(s.results)){
      html += '<tr><td>'+k+'</td><td>'+v+'</td></tr>';
    }
    html += '</table></div></div>';
  }
  document.getElementById('results').innerHTML = html;
}

function renderCompare(results){
  const labels = {'water':'水化脱胶','acid':'酸法脱胶','super':'超级脱胶','enzymatic':'酶法脱胶'};
  const keys = ['yield_pct','total_loss_pct','product_av','product_color_r','product_ve_ppm'];
  const names = {'yield_pct':'精炼得率 %','total_loss_pct':'总油损 %','product_av':'成品AV','product_color_r':'色泽(红)','product_ve_ppm':'VE保留 ppm'};

  let rows = '';
  for(const k of keys){
    rows += '<tr><td><b>'+names[k]+'</b></td>';
    let vals = results.map(r=>r.output[k]);
    let best = k==='yield_pct'||k==='product_ve_ppm' ? Math.max(...vals) : Math.min(...vals);
    let worst = k==='yield_pct'||k==='product_ve_ppm' ? Math.min(...vals) : Math.max(...vals);
    for(const r of results){
      let v = r.output[k];
      let cls = (v===best)?'best':(v===worst)?'worst':'';
      rows += '<td class="'+cls+'">'+v+'</td>';
    }
    rows += '</tr>';
  }

  let html = '<h4 style="margin-bottom:12px;">&#128202; 四种脱胶方式对比</h4>'+
    '<table class="compare-table"><thead><tr><th>指标</th>';
  for(const r of results) html += '<th>'+labels[r._label]+'</th>';
  html += '</tr></thead><tbody>'+rows+'</tbody></table>';
  html += '<p style="margin-top:8px;font-size:11px;color:var(--muted);"><span style="color:var(--good);">&#9679; 绿色</span> = 最优 &nbsp; <span style="color:var(--danger);">&#9679; 红色</span> = 最差</p>';

  document.getElementById('results').innerHTML = html;
}

function saveScenario(){
  if(!currentResult){ alert('请先运行模拟'); return; }
  const p = getParams();
  const name = p.oil+' | AV:'+p.av+' P:'+p.p+'ppm | '+p.degum;
  savedScenarios.push({name, params:p, result:currentResult});
  renderSidebar();
}

function renderSidebar(){
  if(savedScenarios.length===0){
    document.getElementById('scenarioList').innerHTML = '<div class="empty" style="padding:20px;font-size:12px;text-align:center;">暂无保存的方案</div>';
    return;
  }
  let html = '';
  savedScenarios.forEach((s,i)=>{
    html += '<div class="scenario" onclick="loadScenario('+i+')">'+
      '<span>'+s.name.substring(0,25)+'</span>'+
      '<span class="badge">'+s.result.output.yield_pct+'%</span></div>';
  });
  html += '<button class="btn-add" onclick="clearScenarios()">清空全部</button>';
  document.getElementById('scenarioList').innerHTML = html;
}

function loadScenario(i){
  const s = savedScenarios[i];
  document.getElementById('oilType').value = s.params.oil;
  document.getElementById('mass').value = s.params.mass;
  document.getElementById('av').value = s.params.av;
  document.getElementById('p').value = s.params.p;
  document.getElementById('nhp').value = s.params.nhp;
  document.getElementById('degum').value = s.params.degum;
  document.getElementById('pa_pct').value = s.params.pa_pct;
  document.getElementById('excess').value = s.params.excess;
  currentResult = s.result;
  renderSingle(s.result);
}

function clearScenarios(){ savedScenarios=[]; renderSidebar(); }
function addScenario(){ document.getElementById('oilType').focus(); }

function openReport(){
  if(!currentResult){ alert('请先运行模拟'); return; }
  const d = currentResult;
  const o = d.output;
  let rows = '';
  for(const s of d.stages){
    for(const [k,v] of Object.entries(s.results)){
      rows += '<tr><td>'+s.name+'</td><td>'+k+'</td><td>'+v+'</td></tr>';
    }
  }
  document.getElementById('reportContent').innerHTML =
    '<h2>油脂精炼工艺模拟报告</h2>'+
    '<div class="sub">报告生成日期: '+new Date().toLocaleDateString('zh-CN')+' &nbsp;|&nbsp; 引擎版本: v2.0</div>'+
    '<h3>一、原料信息</h3>'+
    '<table><tr><th>项目</th><th>数值</th></tr>'+
    '<tr><td>油种</td><td>'+d.input.oil+'</td></tr>'+
    '<tr><td>批处理量</td><td>'+d.input.mass_ton+' 吨</td></tr>'+
    '<tr><td>酸价</td><td>'+d.input.av+' mgKOH/g</td></tr>'+
    '<tr><td>磷含量</td><td>'+d.input.p_ppm+' ppm</td></tr>'+
    '<tr><td>脱胶方式</td><td>'+d.input.degum_type+'</td></tr>'+
    '</table>'+
    '<h3>二、成品油指标</h3>'+
    '<table><tr><th>指标</th><th>数值</th></tr>'+
    '<tr><td>成品油质量</td><td>'+(o.product_kg/1000).toFixed(1)+' 吨</td></tr>'+
    '<tr><td>酸价 (AV)</td><td>'+o.product_av+'</td></tr>'+
    '<tr><td>磷含量</td><td>'+o.product_p_ppm+' ppm</td></tr>'+
    '<tr><td>色泽 (罗维朋 1")</td><td>R '+o.product_color_r+' / Y '+o.product_color_y+'</td></tr>'+
    '<tr><td>生育酚 (VE)</td><td>'+o.product_ve_ppm+' ppm</td></tr>'+
    '<tr><td>精炼得率</td><td><b>'+o.yield_pct+'%</b></td></tr>'+
    '<tr><td>总油损</td><td>'+(o.total_loss_kg/1000).toFixed(1)+' 吨 ('+o.total_loss_pct+'%)</td></tr>'+
    '</table>'+
    '<h3>三、各工段详细数据</h3>'+
    '<table><tr><th>工段</th><th>参数</th><th>数值</th></tr>'+rows+'</table>'+
    '<h3>四、工艺评价与建议</h3>'+
    '<p>1. 脱胶工段：采用'+d.input.degum_type+'方式，目标将磷含量从 '+d.input.p_ppm+' ppm 降至合理水平。</p>'+
    '<p>2. 碱炼工段：超量碱 '+d.input.excess_lye_pct+'%，碱炼后酸价降至 '+o.product_av+'。</p>'+
    '<p>3. 脱色工段：白土处理后色泽达到 R'+o.product_color_r+'/Y'+o.product_color_y+'。</p>'+
    '<p>4. 脱臭工段：高温真空条件下完成脱臭，成品VE保留 '+o.product_ve_ppm+' ppm。</p>'+
    '<p style="margin-top:16px;"><b>综合结论：</b>本批次'+d.input.oil+'精炼总得率 <b>'+o.yield_pct+'%</b>，成品油指标符合一级油标准。</p>'+
    '<div class="seal">姜振宇</div>'+
    '<div style="text-align:right;font-size:12px;color:var(--muted);">'+new Date().toLocaleDateString('zh-CN')+'</div>';
  document.getElementById('reportModal').classList.add('show');
}

function closeReport(){ document.getElementById('reportModal').classList.remove('show'); }
document.getElementById('reportModal').addEventListener('click',function(e){ if(e.target===this) closeReport(); });
</script>
</body>
</html>
